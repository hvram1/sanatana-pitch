<text class="lane" x="22" y="221.0">Students</text>
<rect class="band" x="10" y="274" width="1470" height="186" rx="8"/>
<text class="lane" x="22" y="372.0">Junior vidvāns</text>
<path class="ed" d="M282 108 L338 108" marker-end="url(#a-correction)"/>
<path class="ed" d="M476 108 L532 108" marker-end="url(#a-correction)"/>
<path class="ed" d="M670 108 L686 108 L686 216 L726 216" marker-end="url(#a-correction)"/>
<text class="el" x="686" y="166" text-anchor="middle">read</text>

<path class="ed hum" d="M1058 324 L1086 324 L1086 108 L1114 108" marker-end="url(#h-correction)"/>
<path class="ed" d="M670 108 L726 108" marker-end="url(#a-correction)"/>
<text class="el" x="690" y="102" text-anchor="middle">2nd flag</text>
<path class="ed" d="M864 108 L904 108 L904 410 L920 410" marker-end="url(#a-correction)"/>
<path class="ed hum" d="M1058 410 L1086 410 L1086 108 L1114 108" marker-end="url(#h-correction)"/>
<path class="ed" d="M1252 108 L1308 108" marker-end="url(#a-correction)"/>
<g class="L-agent"><rect class="nb" x="144.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="153.0" y="88.0">1</text><text class="who" x="166.0" y="88.0">Reviewer</text>
<text class="tx" x="153.0" y="105.0">wrong Parīkṣit for</text>
<text class="tx" x="153.0" y="119.0">Bhāgavata 1.18</text>
</g>
<g class="L-agent"><rect class="nb" x="338.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="347.0" y="88.0">2</text><text class="who" x="360.0" y="88.0">Discoverer</text>
<text class="tx" x="347.0" y="105.0">right one exists:</text>
<text class="tx" x="347.0" y="119.0">Parikṣit, 46 verses</text>
</g>
<g class="L-agent"><rect class="nb" x="532.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="541.0" y="88.0">3</text><text class="who" x="554.0" y="88.0">Dossier</text>
<text class="tx" x="541.0" y="105.0">both claimants side</text>
<text class="tx" x="541.0" y="119.0">by side</text>
</g>
<g class="L-student gate"><rect class="nb" x="726.0" y="180.0" width="138" height="72" rx="9"/>
<path class="gm" d="M852.0 234.0 l6 6 l-6 6 l-6 -6 z"/>
<text class="num" x="735.0" y="196.0">4</text><text class="who" x="748.0" y="196.0">Students</text>
<text class="tx" x="735.0" y="213.0">which Parīkṣit is</text>
<text class="tx" x="735.0" y="227.0">each verse?</text>
</g>
<g class="L-junior gate"><rect class="nb" x="920.0" y="288.0" width="138" height="72" rx="9"/>
<path class="gm" d="M1046.0 342.0 l6 6 l-6 6 l-6 -6 z"/>
<text class="num" x="929.0" y="304.0">5</text><text class="who" x="942.0" y="304.0">Junior vidvān</text>
<text class="tx" x="929.0" y="321.0">signs; old link</text>
<text class="tx" x="929.0" y="335.0">superseded</text>
</g>
<g class="L-agent"><rect class="nb" x="726.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="735.0" y="88.0">6</text><text class="who" x="748.0" y="88.0">Reviewer</text>
<text class="tx" x="735.0" y="105.0">Āstīka or Bṛhaspati?</text>
<text class="tx" x="735.0" y="119.0">flags it</text>
</g>
<g class="L-junior gate"><rect class="nb" x="920.0" y="374.0" width="138" height="72" rx="9"/>
<path class="gm" d="M1046.0 428.0 l6 6 l-6 6 l-6 -6 z"/>
<text class="num" x="929.0" y="390.0">7</text><text class="who" x="942.0" y="390.0">Junior vidvān</text>
<text class="tx" x="929.0" y="407.0">two sources: both</text>
<text class="tx" x="929.0" y="421.0">stand</text>
</g>
<g class="L-agent"><rect class="nb" x="1114.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="1123.0" y="88.0">8</text><text class="who" x="1136.0" y="88.0">Publisher</text>
<text class="tx" x="1123.0" y="105.0">ledger, nightly</text>
<text class="tx" x="1123.0" y="119.0">build</text>
</g>
<g class="L-agent"><rect class="nb" x="1308.0" y="72.0" width="138" height="72" rx="9"/>
<text class="num" x="1317.0" y="88.0">9</text><text class="who" x="1330.0" y="88.0">Reporter</text>
<text class="tx" x="1317.0" y="105.0">proposes the vowel-</text>
<text class="tx" x="1317.0" y="119.0">length fold</text>
</g>
</svg>
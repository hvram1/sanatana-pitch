<text class="zone" x="1300" y="1088" text-anchor="end">THE MAHĀBHĀRATA IS TOLD TO JANAMEJAYA</text>
<g class="door q"><rect class="f" x="40" y="700" width="385" height="180" rx="12" style="fill:var(--gold-soft,#fbf1dc);stroke:var(--gold,#a86a00)"/>
<text class="dt" x="56" y="728" style="fill:var(--gold,#a86a00)">What the index holds today</text>
<text class="dr" x="56" y="756" style="fill:var(--gold,#a86a00)">36</text>
<text class="dl" x="148" y="756">family links, copied from Sørensen</text>
<text class="dr" x="56" y="780" style="fill:var(--gold,#a86a00)">0</text>
<text class="dl" x="148" y="780">of them checked by a scholar</text>
<text class="dr" x="56" y="804" style="fill:var(--gold,#a86a00)">220</text>
<text class="dl" x="148" y="804">Mahābhārata verses cited for Yayāti</text>
<text class="dr" x="56" y="828" style="fill:var(--gold,#a86a00)">~477</text>
<text class="dl" x="148" y="828">Purāṇa verses with his name</text>
<text class="dr" x="56" y="852" style="fill:var(--gold,#a86a00)">0</text>
<text class="dl" x="148" y="852">of those linked to him</text>
</g>
<g class="door x"><rect class="f" x="440" y="700" width="385" height="180" rx="12" style="fill:var(--clay-soft,#f6e6e2);stroke:var(--clay,#8a3b2e)"/>
<text class="dt" x="456" y="728" style="fill:var(--clay,#8a3b2e)">What is wrong or unknown</text>
<text class="dr" x="456" y="756" style="fill:var(--clay,#8a3b2e)">wrong</text>
<text class="dl" x="548" y="756">3 links join the wrong namesake</text>
<text class="dr" x="456" y="780" style="fill:var(--clay,#8a3b2e)">wrong</text>
<text class="dl" x="548" y="780">Devayānī given the wrong father</text>
<text class="dr" x="456" y="804" style="fill:var(--clay,#8a3b2e)">misfiled</text>
<text class="dl" x="548" y="804">his Purāṇa verses filed under a place</text>
<text class="dr" x="456" y="828" style="fill:var(--clay,#8a3b2e)">spelling</text>
<text class="dl" x="548" y="828">Śantanu stored three ways</text>
<text class="dr" x="456" y="852" style="fill:var(--clay,#8a3b2e)">open</text>

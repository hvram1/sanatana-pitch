<svg xmlns="http://www.w3.org/2000/svg" class="ym today" viewBox="0 0 1400 1110" role="img" aria-labelledby="ymt ymd">
<title id="ymt">Yayāti’s family in the index today</title>
<desc id="ymd">A family tree from the Mahābhārata, Yayāti to Janamejaya, as the index holds it now: every link copied from Sørensen and none checked, three joining the wrong namesake, and none of his Purāṇa verses linked.</desc>

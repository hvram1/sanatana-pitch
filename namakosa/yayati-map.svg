<text class="rl" x="925" y="917.0" text-anchor="middle">the healer, turned back</text>
<text class="rl" x="925" y="931.0" text-anchor="middle">revives the burnt tree</text>
</g>
<g class="n line"><rect class="nb" x="1095.0" y="1004.0" width="150" height="62" rx="10"/>
<text class="nm" x="1170" y="1026.0" text-anchor="middle">Janamejaya <tspan class="dv">जनमेजयः</tspan></text>

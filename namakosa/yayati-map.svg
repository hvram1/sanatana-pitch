<text class="ttl" x="40" y="34">Yayāti’s world, and two doors into the Purāṇas</text>
<text class="zone" x="1290" y="330" text-anchor="end">PŪRU’S LINE ↓</text>
<text class="zone" x="1300" y="1088" text-anchor="end">ARC 1 · TOLD TO HIS OWN DESCENDANT</text>
<g class="door bh"><rect class="f" x="40" y="700" width="385" height="180" rx="12" style="fill:var(--leaf-soft,#e2f0e9);stroke:var(--leaf,#2f6f55)"/>

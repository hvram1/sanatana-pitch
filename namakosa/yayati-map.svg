<text class="dr" x="56" y="756" style="fill:var(--leaf,#2f6f55)">9.18–19</text>
<text class="dl" x="148" y="756">Yayāti, Devayānī, Śarmiṣṭhā, Pūru</text>
<text class="dr" x="56" y="780" style="fill:var(--leaf,#2f6f55)">9.20, 9.22</text>
<text class="dl" x="148" y="780">Pūru’s line to the Pāṇḍavas</text>
<text class="dr" x="56" y="804" style="fill:var(--leaf,#2f6f55)">1.18–19</text>
<text class="dl" x="148" y="804">the curse; Śuka comes to Parīkṣit</text>
<text class="dr" x="56" y="828" style="fill:var(--leaf,#2f6f55)">12.6.16–28</text>
<text class="dl" x="148" y="828">the sacrifice; Bṛhaspati stops it</text>
<text class="dr" x="56" y="852" style="fill:var(--leaf,#2f6f55)">12.6.11</text>
<text class="dl" x="148" y="852">Takṣaka meets Kāśyapa on the road</text>
</g>
<g class="door gp"><rect class="f" x="440" y="700" width="385" height="180" rx="12" style="fill:var(--clay-soft,#f6e6e2);stroke:var(--clay,#8a3b2e)"/>
<text class="dt" x="456" y="728" style="fill:var(--clay,#8a3b2e)">Door 2 · Garuḍa Purāṇa, through Garuḍa</text>
<text class="dr" x="456" y="756" style="fill:var(--clay,#8a3b2e)">Ā. 2</text>

</g>
<g class="n "><rect class="nb" x="485.0" y="442.0" width="150" height="76" rx="10"/>
<text class="nm" x="560" y="464.0" text-anchor="middle">Gālava <tspan class="dv">गालवः</tspan></text>
<text class="rl" x="560" y="482.0" text-anchor="middle">owes 800 horses</text>
<text class="rl" x="560" y="496.0" text-anchor="middle">to Viśvāmitra</text>

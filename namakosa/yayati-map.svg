<g class="n "><rect class="nb" x="35.0" y="69.0" width="150" height="62" rx="10"/>
<text class="nm" x="110" y="91.0" text-anchor="middle">Bṛhaspati <tspan class="dv">बृहस्पतिः</tspan></text>
<text class="rl" x="110" y="109.0" text-anchor="middle">guru of the devas</text>
</g>
<g class="n "><rect class="nb" x="345.0" y="62.0" width="150" height="76" rx="10"/>
<text class="nm" x="420" y="84.0" text-anchor="middle">Śukra <tspan class="dv">शुक्रः</tspan></text>
<text class="rl" x="420" y="102.0" text-anchor="middle">guru of the asuras</text>
<text class="rl" x="420" y="116.0" text-anchor="middle">curses Yayāti: old age</text>
</g>
<g class="n "><rect class="nb" x="565.0" y="69.0" width="150" height="62" rx="10"/>
<text class="nm" x="640" y="91.0" text-anchor="middle">Nahuṣa <tspan class="dv">नहुषः</tspan></text>
<text class="rl" x="640" y="109.0" text-anchor="middle">Yayāti's father</text>
</g>
<g class="n "><rect class="nb" x="785.0" y="69.0" width="150" height="62" rx="10"/>
<text class="nm" x="860" y="91.0" text-anchor="middle">Vṛṣaparvan <tspan class="dv">वृषपर्वा</tspan></text>
<text class="rl" x="860" y="109.0" text-anchor="middle">king of the asuras</text>
</g>
<g class="n "><rect class="nb" x="35.0" y="177.0" width="150" height="76" rx="10"/>
<text class="nm" x="110" y="199.0" text-anchor="middle">Kaca <tspan class="dv">कचः</tspan></text>
<text class="rl" x="110" y="217.0" text-anchor="middle">learns the sañjīvanī</text>
<text class="rl" x="110" y="231.0" text-anchor="middle">refuses Devayānī</text>
</g>
<g class="n "><rect class="nb" x="345.0" y="184.0" width="150" height="62" rx="10"/>
<text class="nm" x="420" y="206.0" text-anchor="middle">Devayānī <tspan class="dv">देवयानी</tspan></text>
<text class="rl" x="420" y="224.0" text-anchor="middle">Śukra's daughter</text>
</g>
<g class="n hero"><rect class="nb" x="542.0" y="177.0" width="196" height="76" rx="10"/>
<text class="nm" x="640" y="199.0" text-anchor="middle">Yayāti <tspan class="dv">ययातिः</tspan></text>
<text class="rl" x="640" y="217.0" text-anchor="middle">“desire is never</text>
<text class="rl" x="640" y="231.0" text-anchor="middle">quenched by indulgence”</text>
</g>
<g class="n "><rect class="nb" x="785.0" y="184.0" width="150" height="62" rx="10"/>
<text class="nm" x="860" y="206.0" text-anchor="middle">Śarmiṣṭhā <tspan class="dv">शर्मिष्ठा</tspan></text>
<text class="rl" x="860" y="224.0" text-anchor="middle">Vṛṣaparvan's daughter</text>
</g>
<g class="n "><rect class="nb" x="305.0" y="317.0" width="150" height="76" rx="10"/>
<text class="nm" x="380" y="339.0" text-anchor="middle">Yadu <tspan class="dv">यदुः</tspan></text>
<text class="rl" x="380" y="357.0" text-anchor="middle">refuses the old age</text>
<text class="rl" x="380" y="371.0" text-anchor="middle">his line: the Yādavas</text>
</g>
<g class="n "><rect class="nb" x="465.0" y="324.0" width="150" height="62" rx="10"/>
<text class="nm" x="540" y="346.0" text-anchor="middle">Turvasu <tspan class="dv">तुर्वसुः</tspan></text>
<text class="rl" x="540" y="364.0" text-anchor="middle">refuses</text>
</g>
<g class="n "><rect class="nb" x="645.0" y="324.0" width="150" height="62" rx="10"/>
<text class="nm" x="720" y="346.0" text-anchor="middle">Druhyu <tspan class="dv">द्रुह्युः</tspan></text>
<text class="rl" x="720" y="364.0" text-anchor="middle">refuses</text>
</g>
<g class="n "><rect class="nb" x="805.0" y="324.0" width="150" height="62" rx="10"/>
<text class="nm" x="880" y="346.0" text-anchor="middle">Anu <tspan class="dv">अनुः</tspan></text>
<text class="rl" x="880" y="364.0" text-anchor="middle">refuses</text>
</g>
<g class="n line"><rect class="nb" x="975.0" y="317.0" width="150" height="76" rx="10"/>
